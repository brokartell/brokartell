name: Pixel Bro – Windows-Build (Test)

on:
  push:
    branches:
      - '**'          # nur Branches – Versionsmarken baut der Release-Workflow
    paths:
      - 'pixel-bro/**'
      - '.github/workflows/pixel-bro-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pixel-bro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixel-bro/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Update-Wartezeit testen (Installer startet verzögert)
        run: node scripts/test-delayed-install.js

      - name: Installer, portable EXE und ZIP bauen
        run: npx electron-builder --win nsis portable zip --x64 --publish never

      - name: Update-Datei prüfen (für automatische Updates)
        shell: bash
        run: |
          test -f dist/latest.yml || { echo "::error::dist/latest.yml fehlt"; exit 1; }
          cat dist/latest.yml
          grep -q "path: Pixel-Bro-Setup.exe" dist/latest.yml
          test -f dist/Pixel-Bro-Setup.exe.blockmap
          test -f dist/win-unpacked/resources/app-update.yml && cat dist/win-unpacked/resources/app-update.yml

      - name: Update mit gesperrter Datei testen (Virenscanner nachgestellt)
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-update-locked.ps1

      - name: Ergebnisse hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Bro-Windows
          path: |
            pixel-bro/dist/*.exe
            pixel-bro/dist/*.zip
          if-no-files-found: error
