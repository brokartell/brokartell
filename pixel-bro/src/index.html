<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pixel Bro</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Kopfzeile -->
    <header id="topbar">
      <button class="brand" data-cmd="about" title="Über Pixel Bro">
        <img src="icon.png" alt="" class="brand-icon">
        <span class="brand-name">Pixel Bro</span>
        <span class="brand-version" id="brand-version"></span>
      </button>
      <nav id="menubar">
        <div class="menu" data-menu="datei">
          <button class="menu-btn">Datei</button>
          <div class="menu-list">
            <button data-cmd="new"><span>Neues Sprite …</span><kbd>Strg+N</kbd></button>
            <button data-cmd="open"><span>Projekt öffnen …</span><kbd>Strg+O</kbd></button>
            <button data-cmd="save"><span>Projekt speichern</span><kbd>Strg+S</kbd></button>
            <hr>
            <button data-cmd="import"><span>Bild importieren …</span><kbd>Strg+I</kbd></button>
            <hr>
            <button data-cmd="export-png"><span>Als PNG exportieren …</span><kbd>Strg+E</kbd></button>
            <button data-cmd="export-sheet"><span>Spritesheet exportieren …</span></button>
            <button data-cmd="export-gif"><span>Animiertes GIF exportieren …</span><kbd>Strg+G</kbd></button>
          </div>
        </div>
        <div class="menu" data-menu="bearbeiten">
          <button class="menu-btn">Bearbeiten</button>
          <div class="menu-list">
            <button data-cmd="undo"><span>Rückgängig</span><kbd>Strg+Z</kbd></button>
            <button data-cmd="redo"><span>Wiederholen</span><kbd>Strg+Y</kbd></button>
            <hr>
            <button data-cmd="cut"><span>Ausschneiden</span><kbd>Strg+X</kbd></button>
            <button data-cmd="copy"><span>Kopieren</span><kbd>Strg+C</kbd></button>
            <button data-cmd="paste"><span>Einfügen</span><kbd>Strg+V</kbd></button>
            <button data-cmd="delete"><span>Auswahl löschen</span><kbd>Entf</kbd></button>
            <hr>
            <button data-cmd="select-all"><span>Alles auswählen</span><kbd>Strg+A</kbd></button>
            <button data-cmd="deselect"><span>Auswahl aufheben</span><kbd>Strg+D</kbd></button>
          </div>
        </div>
        <div class="menu" data-menu="bild">
          <button class="menu-btn">Bild</button>
          <div class="menu-list">
            <button data-cmd="resize"><span>Größe ändern …</span><kbd>Strg+R</kbd></button>
            <hr>
            <button data-cmd="flip-h"><span>Horizontal spiegeln</span><kbd>Umschalt+H</kbd></button>
            <button data-cmd="flip-v"><span>Vertikal spiegeln</span><kbd>Umschalt+V</kbd></button>
            <button data-cmd="rotate"><span>90° drehen</span><kbd>Umschalt+R</kbd></button>
            <hr>
            <button data-cmd="replace-color"><span>Farbe ersetzen (alle Frames)</span></button>
            <button data-cmd="outline"><span>Umriss hinzufügen</span></button>
            <hr>
            <button data-cmd="gb-palettes"><span>GB-Studio-Paletten prüfen …</span><kbd>Umschalt+G</kbd></button>
            <button data-cmd="clear-layer"><span>Ebene leeren</span></button>
          </div>
        </div>
        <div class="menu" data-menu="ansicht">
          <button class="menu-btn">Ansicht</button>
          <div class="menu-list">
            <button data-cmd="toggle-grid"><span>Pixelraster</span><kbd>#</kbd></button>
            <button data-cmd="toggle-center"><span>Mittellinien</span><kbd>Umschalt+M</kbd></button>
            <button data-cmd="toggle-tilegrid"><span>Kachelraster …</span></button>
            <button data-cmd="toggle-tile"><span>Kachel-Modus (nahtlos)</span><kbd>T</kbd></button>
            <button data-cmd="toggle-onion"><span>Zwiebelhaut</span><kbd>Umschalt+O</kbd></button>
            <hr>
            <button data-cmd="zoom-in"><span>Vergrößern</span><kbd>+</kbd></button>
            <button data-cmd="zoom-out"><span>Verkleinern</span><kbd>−</kbd></button>
            <button data-cmd="zoom-fit"><span>Einpassen</span><kbd>0</kbd></button>
            <hr>
            <button data-cmd="toggle-theme"><span>Helles / dunkles Design</span></button>
            <hr>
            <button data-cmd="lang-de" data-i18n-skip><span>Deutsch</span><kbd>DE</kbd></button>
            <button data-cmd="lang-en" data-i18n-skip><span>English</span><kbd>EN</kbd></button>
          </div>
        </div>
        <div class="menu" data-menu="hilfe">
          <button class="menu-btn">Hilfe</button>
          <div class="menu-list">
            <button data-cmd="shortcuts"><span>Tastenkürzel</span><kbd>F1</kbd></button>
            <hr class="desktop-only">
            <button data-cmd="update-check" class="desktop-only"><span>Nach Updates suchen …</span></button>
            <button data-cmd="toggle-autoupdate" class="desktop-only"><span>Automatisch nach Updates suchen</span></button>
            <hr>
            <button data-cmd="about"><span>Über Pixel Bro</span></button>
          </div>
        </div>
      </nav>
      <div class="top-actions">
        <button class="icon-btn" data-cmd="undo" title="Rückgängig (Strg+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="icon-btn" data-cmd="redo" title="Wiederholen (Strg+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <span class="divider"></span>
        <button class="btn primary" data-cmd="export-png"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exportieren</button>
      </div>
    </header>

    <!-- Werkzeugoptionen -->
    <div id="optionsbar">
      <div class="opt-group" id="opt-size">
        <label>Pinselgröße</label>
        <input type="range" id="brush-size" min="1" max="16" value="1">
        <span id="brush-size-val" class="mono">1 px</span>
      </div>
      <div class="opt-group" id="opt-fill">
        <label class="toggle"><input type="checkbox" id="opt-filled"><span>Gefüllt</span></label>
      </div>
      <div class="opt-group" id="opt-pp">
        <label class="toggle" title="Entfernt doppelte Eckpixel bei 1-px-Linien"><input type="checkbox" id="opt-pixelperfect" checked><span>Pixel-Perfect</span></label>
      </div>
      <div class="opt-group" id="opt-contig">
        <label class="toggle" title="Aus: ersetzt die Farbe überall auf der Ebene"><input type="checkbox" id="opt-contiguous" checked><span>Zusammenhängend</span></label>
      </div>
      <div class="opt-group" id="opt-shade">
        <label>Stärke</label>
        <input type="range" id="shade-strength" min="2" max="40" value="10">
      </div>
      <div class="opt-group" id="opt-grad">
        <label title="Anzahl der Farbstufen im Verlauf">Stufen</label>
        <input type="range" id="grad-steps" min="2" max="16" value="4">
        <span id="grad-steps-val" class="mono">4</span>
        <label class="toggle" title="Weicher Übergang mit Pixel-Muster"><input type="checkbox" id="opt-grad-dither" checked><span>Dithering</span></label>
      </div>
      <div class="opt-group" id="opt-spray">
        <label title="Wie viele Pixel pro Sprühstoß">Dichte</label>
        <input type="range" id="spray-density" min="1" max="20" value="6">
        <span id="spray-density-val" class="mono">6</span>
      </div>
      <div class="opt-group">
        <label class="toggle" title="Horizontal gespiegelt zeichnen"><input type="checkbox" id="opt-mirror-x"><span>Spiegel ↔</span></label>
        <label class="toggle" title="Vertikal gespiegelt zeichnen"><input type="checkbox" id="opt-mirror-y"><span>Spiegel ↕</span></label>
      </div>
      <div class="opt-spacer"></div>
      <div class="opt-group">
        <label class="toggle"><input type="checkbox" id="opt-grid" checked><span>Raster</span></label>
        <label class="toggle" title="Mittellinien: waagerecht und senkrecht durch die Bildmitte"><input type="checkbox" id="opt-center"><span>Mitte</span></label>
        <label class="toggle"><input type="checkbox" id="opt-onion"><span>Zwiebelhaut</span></label>
        <label class="toggle"><input type="checkbox" id="opt-tile"><span>Kachel-Modus</span></label>
      </div>
    </div>

    <main id="workspace">
      <!-- Werkzeugleiste -->
      <aside id="toolbar">
        <button class="tool" data-tool="pen" title="Stift (B)"><svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button class="tool" data-tool="eraser" title="Radierer (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
        <button class="tool" data-tool="bucket" title="Füllen (G)"><svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg></button>
        <button class="tool" data-tool="gradient" title="Verlauf (J) – ziehen: Primär- → Sekundärfarbe"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="3" y="3" width="6" height="18" rx="1" fill="currentColor"/><path d="M12.5 6v1.5M12.5 11v1.5M12.5 16v1.5M16.5 8.5V10M16.5 13.5V15"/></svg></button>
        <button class="tool" data-tool="picker" title="Pipette (I) – oder Alt gedrückt halten"><svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3Z"/></svg></button>
        <span class="tool-sep"></span>
        <button class="tool" data-tool="line" title="Linie (L)"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg></button>
        <button class="tool" data-tool="rect" title="Rechteck (R)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
        <button class="tool" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
        <button class="tool" data-tool="text" title="Text (K)"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></button>
        <span class="tool-sep"></span>
        <button class="tool" data-tool="select" title="Auswahl (M)"><svg viewBox="0 0 24 24"><path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/></svg></button>
        <button class="tool" data-tool="wand" title="Zauberstab (W)"><svg viewBox="0 0 24 24"><path d="m21.6 2.4-1.2-1.2a1.2 1.2 0 0 0-1.7 0L1.2 18.7a1.2 1.2 0 0 0 0 1.7l1.2 1.2a1.2 1.2 0 0 0 1.7 0L21.6 4.1a1.2 1.2 0 0 0 0-1.7Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg></button>
        <button class="tool" data-tool="move" title="Verschieben (V)"><svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg></button>
        <span class="tool-sep"></span>
        <button class="tool" data-tool="dither" title="Dithering (D)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" fill="currentColor"/><rect x="15" y="3" width="6" height="6" fill="currentColor"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/><rect x="3" y="15" width="6" height="6" fill="currentColor"/><rect x="15" y="15" width="6" height="6" fill="currentColor"/></svg></button>
        <button class="tool" data-tool="spray" title="Sprühdose (S)"><svg viewBox="0 0 24 24"><path d="M3 3h.01"/><path d="M7 5h.01"/><path d="M11 7h.01"/><path d="M3 7h.01"/><path d="M7 9h.01"/><path d="M3 11h.01"/><rect width="4" height="4" x="15" y="5"/><path d="m19 9 2 2v10c0 .6-.4 1-1 1h-6c-.6 0-1-.4-1-1V11l2-2"/><path d="m13 14 8-2"/><path d="m13 19 8-2"/></svg></button>
        <button class="tool" data-tool="shade" title="Aufhellen / Abdunkeln (U) – Umschalt dunkelt ab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg></button>
        <button class="tool" data-tool="hand" title="Hand (H) – oder Leertaste halten"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg></button>

        <div class="color-pair" title="Links: Primärfarbe · Rechts-Klick malt mit Sekundärfarbe · X tauscht">
          <button id="color-secondary" class="color-chip secondary"></button>
          <button id="color-primary" class="color-chip primary"></button>
          <button id="swap-colors" class="swap" title="Farben tauschen (X)"><svg viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H10a6 6 0 0 0-6 6"/></svg></button>
        </div>
      </aside>


      <!-- Zeichenfläche -->
      <section id="stage">
        <canvas id="canvas"></canvas>
        <div class="sbar sbar-h" id="sbar-h" hidden><div class="sbar-thumb"></div></div>
        <div class="sbar sbar-v" id="sbar-v" hidden><div class="sbar-thumb"></div></div>
        <div id="gb-hud" hidden>
          <button id="gb-hud-open" title="Details anzeigen"><span class="gb-dot"></span><span id="gb-hud-text"></span></button>
          <button id="gb-hud-close" class="icon-btn small" title="Ansicht ausblenden"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div id="zoom-hud">
          <button class="icon-btn small" data-cmd="zoom-out" title="Verkleinern">−</button>
          <span id="zoom-label" class="mono">100%</span>
          <button class="icon-btn small" data-cmd="zoom-in" title="Vergrößern">+</button>
          <button class="icon-btn small" data-cmd="zoom-fit" title="Einpassen"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
        </div>
      </section>

      <!-- Seitenleiste -->
      <aside id="sidebar">
        <section class="panel" id="panel-preview">
          <header class="panel-head">
            <h3>Vorschau</h3>
            <div class="panel-actions">
              <button class="icon-btn small" id="preview-play" title="Abspielen / Pause"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8Z" fill="currentColor"/></svg></button>
            </div>
          </header>
          <div class="preview-box"><canvas id="preview"></canvas></div>
          <div class="row">
            <label>FPS</label>
            <input type="range" id="fps" min="1" max="30" value="8">
            <span id="fps-val" class="mono">8</span>
          </div>
        </section>

        <section class="panel grow" id="panel-palette">
          <header class="panel-head">
            <h3>Farbe &amp; Palette <span id="palette-count" class="count"></span></h3>
            <div class="panel-actions">
              <button class="icon-btn small" id="pal-add" title="Primärfarbe zur Palette hinzufügen (bei Vorlagen: als eigene Kopie)"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
              <button class="icon-btn small" id="pal-from-image" title="Farben aus dem Bild als eigene Palette übernehmen"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></button>
            </div>
          </header>
          <div class="color-editor">
            <input type="color" id="color-input" value="#ff004d">
            <div class="color-fields">
              <div class="row"><label>HEX</label><input type="text" id="hex-input" class="mono" maxlength="9" spellcheck="false"></div>
              <div class="row"><label>Deckkraft</label><input type="range" id="alpha-input" min="0" max="255" value="255"><span id="alpha-val" class="mono">100%</span></div>
            </div>
          </div>
          <div id="recent-colors" class="recent" title="Zuletzt benutzt"></div>
          <div class="pal-row">
            <select id="palette-select" title="Palette wählen"></select>
            <button class="icon-btn small" id="pal-new" title="Neue eigene Palette"><svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg></button>
            <button class="icon-btn small" id="pal-rename" title="Eigene Palette umbenennen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn small danger" id="pal-delete" title="Eigene Palette löschen"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
          <div id="palette" class="palette"></div>
          <p class="hint" id="palette-hint">Klick: Primär · Rechtsklick: Sekundär · Strg+Klick: entfernen</p>
        </section>

        <section class="panel grow" id="panel-layers">
          <header class="panel-head">
            <h3>Ebenen</h3>
            <div class="panel-actions">
              <button class="icon-btn small" data-cmd="layer-add" title="Neue Ebene"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
              <button class="icon-btn small" data-cmd="layer-dup" title="Ebene duplizieren"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-1-2V4a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1"/></svg></button>
              <button class="icon-btn small" data-cmd="layer-up" title="Nach oben"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
              <button class="icon-btn small" data-cmd="layer-down" title="Nach unten"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
              <button class="icon-btn small" data-cmd="layer-merge" title="Mit darunterliegender zusammenführen"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg></button>
              <button class="icon-btn small danger" data-cmd="layer-del" title="Ebene löschen"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
          </header>
          <div id="layers" class="layers"></div>
          <div class="row">
            <label>Deckkraft</label>
            <input type="range" id="layer-opacity" min="0" max="100" value="100">
            <span id="layer-opacity-val" class="mono">100%</span>
          </div>
        </section>
      </aside>
    </main>

    <!-- Zeitleiste -->
    <footer id="timeline">
      <div class="timeline-controls">
        <button class="icon-btn" data-cmd="frame-prev" title="Vorheriger Frame (,)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="icon-btn" data-cmd="frame-next" title="Nächster Frame (.)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <span class="divider"></span>
        <button class="icon-btn" data-cmd="frame-add" title="Neuer Frame (N)"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
        <button class="icon-btn" data-cmd="frame-dup" title="Frame duplizieren (Umschalt+N)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-1-2V4a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1"/></svg></button>
        <button class="icon-btn danger" data-cmd="frame-del" title="Frame löschen"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
      <div id="frames" class="frames"></div>
      <div id="statusbar">
        <span id="status-pos" class="mono">–</span>
        <span id="status-size" class="mono">32 × 32</span>
        <span id="status-frame" class="mono">Frame 1/1</span>
        <span id="status-msg"></span>
      </div>
    </footer>
  </div>

  <!-- Dialog -->
  <div id="modal-backdrop" hidden>
